<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thalassery Hotel</title>

<link rel="icon" href="images/thalassery_logo.png">


<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    background:
    radial-gradient(circle at top,#115e59 0%,#064e3b 35%,#022c22 70%,#01110d 100%);
    background-attachment:fixed;
}

.card{
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
}

::-webkit-scrollbar{
    height:6px;
}

::-webkit-scrollbar-thumb{
    background:#14b8a6;
    border-radius:20px;
}

</style>

</head>

<body>

<div class="max-w-7xl mx-auto gap-5 p-3 md:p-6">


<div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl mb-3 shadow-2xl text-white p-5 md:p-8">

<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

<div class="flex items-center gap-4">

<img
src="IMAGES/thalassery_logo.png"
class="w-16 h-16 md:w-20 md:h-20 rounded-full border-4 border-amber-500 shadow-lg"
>

<div>

<h1
id="hotelTitle"
class="text-2xl md:text-4xl  font-bold tracking-wide">
THALASSERY HOTEL
</h1>

<p
id="todayDate"
class="text-teal-100 mt-1">
</p>

</div>

</div>

<button
id="adminBtn"
onclick="openLogin()"
class="flex items-center justify-center gap-2 w-full md:w-auto bg-white/10 backdrop-blur-xl border border-white/20 hover:bg-white/20 text-white px-6 py-3 rounded-2xl shadow-xl transition">

<svg xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="2"
stroke="currentColor"
class="w-6 h-6">

<path stroke-linecap="round"
stroke-linejoin="round"
d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 0h10.5a.75.75 0 01.75.75v8.25a.75.75 0 01-.75.75H6.75a.75.75 0 01-.75-.75v-8.25a.75.75 0 01.75-.75z"/>

</svg>

<span>Admin Login</span>

</button>

</div>

</div>

  <div class="flex gap-3 ">
<div class="card bg-white/10 backdrop-blur-xl border w-1/2 border-white/20 rounded-3xl shadow-2xl mb-3 p-5 justify-content:center text-white">

    <p class="text-gray-300 text-sm">
        Today's Sales
    </p>

    <h2
        id="totalSales"
        class="text-3xl font-bold text-emerald-400 mt-2">
        ₹0
    </h2>

</div>


<div class="card bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl w-1/2 shadow-2xl mb-3 p-5 text-white">

    <p class="text-gray-300 text-sm">
        Items Sold
    </p>

    <h2
        id="totalItems"
        class="text-3xl font-bold text-cyan-300 mt-2">

        0

    </h2>

</div>

  </div>


<div class="flex w-full gap-3">

<div class="card bg-white/10 backdrop-blur-xl border border-white/20 w-1/2 rounded-3xl shadow-2xl p-5 text-white">

    <label class="font-semibold text-gray-200">

        💵 Cash Collection

    </label>

    <input
        id="cash"
        type="number"
        placeholder="Enter Cash Amount"
        class="w-full mt-3 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 outline-none">

</div>


<div class="card bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl w-1/2 shadow-2xl p-5 text-white">

    <label class="font-semibold text-gray-200">

        📱 UPI Collection

    </label>

    <input
        id="upi"
        type="number"
        placeholder="Enter UPI Amount"
        class="w-full mt-3 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-cyan-500 outline-none">

</div>

</div> 



<div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl mt-3 p-5 text-white">

<div class="flex flex-col md:flex-row justify-between gap-4">

<div>

<p class="text-gray-300">

Cash + UPI Total

</p>

<h2
id="paymentTotal"
class="text-3xl font-bold text-teal-700">

₹0

</h2>

</div>

<div>

<p class="text-gray-300">

Difference

</p>

<h2
id="difference"
class="text-3xl font-bold text-red-600">

₹0

</h2>

</div>

</div>

</div>


<div
id="categories"
class="flex gap-3 overflow-x-scroll whitespace-nowrap mt-6 pb-2">
</div>


<div
id="menuGrid"
class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 mt-6">

</div>



<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">

<button
onclick="saveDay()"
class="flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:scale-105 text-white font-bold rounded-2xl py-4 text-lg shadow-2xl transition duration-300">

<svg xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="2"
stroke="currentColor"
class="w-6 h-6">

<path stroke-linecap="round"
stroke-linejoin="round"
d="M4.5 12.75l6 6 9-13.5"/>

</svg>

<span>Save Day</span>

</button>

<button
onclick="shareReport()"
class="flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:scale-105 text-white font-bold rounded-2xl py-4 text-lg shadow-2xl transition duration-300">

<svg xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="2"
stroke="currentColor"
class="w-6 h-6">

<path stroke-linecap="round"
stroke-linejoin="round"
d="M7.217 10.907a2.25 2.25 0 100-3.182 2.25 2.25 0 000 3.182zm9.566-5.432a2.25 2.25 0 100 3.182 2.25 2.25 0 000-3.182zm0 10.05a2.25 2.25 0 100 3.182 2.25 2.25 0 000-3.182zM8.59 9.79l6.82-3.58m0 11.58l-6.82-3.58"/>

</svg>

<span>Share Report</span>

</button>

<button
onclick="resetSales()"
class="flex items-center justify-center gap-2 bg-gradient-to-r from-red-500 to-rose-600 hover:scale-105 text-white font-bold rounded-2xl py-4 text-lg shadow-2xl transition duration-300">

<svg xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="2"
stroke="currentColor"
class="w-6 h-6">

<path stroke-linecap="round"
stroke-linejoin="round"
d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865A8.25 8.25 0 0117.834 6.165l3.181 3.182"/>

</svg>

<span>Reset Sales</span>

</button>

</div>


<div
id="loginModal"
class="fixed inset-0 hidden items-center justify-center bg-black/40 backdrop-blur-md p-4 z-50">

    <div class="relative w-full max-w-md overflow-hidden rounded-[32px]
        border border-white/20
        bg-white/10
        backdrop-blur-3xl
        shadow-[0_0_50px_rgba(16,185,129,.18),inset_0_1px_0_rgba(255,255,255,.25)]">

        <div class="absolute inset-0 rounded-[32px] border border-white/10 pointer-events-none"></div>

        <div class="px-8 py-8 text-center border-b border-white/10">

            <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full
                bg-white/10
                backdrop-blur-xl
                border border-white/20
                shadow-[0_0_25px_rgba(16,185,129,.3)]">

                <svg xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                    class="w-10 h-10 text-white">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M16.5 10.5V7.5a4.5 4.5 0 10-9 0v3m-.75 0h10.5a.75.75 0 01.75.75v8.25a.75.75 0 01-.75.75H6.75a.75.75 0 01-.75-.75v-8.25a.75.75 0 01.75-.75z"/>

                </svg>

            </div>

            <h2 class="mt-5 text-3xl font-bold text-white">
                Admin Login
            </h2>

            <p class="mt-2 text-gray-300">
                Thalassery Hotel POS
            </p>

        </div>

        <div class="p-8">

            <label class="block mb-2 text-white font-semibold">
                Username
            </label>

            <input
                id="loginUsername"
                type="text"
                placeholder="Enter Username"
                class="w-full rounded-2xl
                bg-white/10
                backdrop-blur-xl
                border border-white/20
                px-5 py-4
                text-white
                placeholder-gray-300
                outline-none
                focus:border-emerald-400
                focus:ring-2
                focus:ring-emerald-500/30">

            <label class="block mt-6 mb-2 text-white font-semibold">
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Enter Password"
                class="w-full rounded-2xl
                bg-white/10
                backdrop-blur-xl
                border border-white/20
                px-5 py-4
                text-white
                placeholder-gray-300
                outline-none
                focus:border-emerald-400
                focus:ring-2
                focus:ring-emerald-500/30">

            <p
                id="loginError"
                class="hidden text-red-400 mt-4">
                Invalid Username or Password
            </p>

            <div class="grid grid-cols-2 gap-4 mt-8">

                <button
                    onclick="closeLogin()"
                    class="rounded-2xl
                    bg-white/10
                    backdrop-blur-xl
                    border border-white/20
                    py-4
                    text-white
                    font-semibold
                    transition
                    hover:bg-white/20">

                    Cancel

                </button>

                <button
                    onclick="loginAdmin()"
                    class="rounded-2xl
                    bg-gradient-to-r
                    from-emerald-500
                    to-teal-600
                    py-4
                    text-white
                    font-semibold
                    shadow-[0_0_25px_rgba(16,185,129,.35)]
                    transition
                    hover:scale-105">

                    Login

                </button>

            </div>

        </div>

    </div>

</div>


<button
id="topBtn"
onclick="window.scrollTo({top:0,behavior:'smooth'})"
class="fixed bottom-5 right-5 hidden
w-16 h-16
flex items-center justify-center
p-4
rounded-[22px]
bg-white/10
backdrop-blur-2xl
border border-white/30
shadow-[0_0_25px_rgba(45,212,191,.5),inset_0_1px_0_rgba(255,255,255,.35)]
hover:scale-105
active:scale-95
transition">

    <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        class="block w-7 h-7 m-0 p-0 text-white align-middle"
        style="vertical-align:unset;">

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 15l7-7 7 7"/>
    </svg>

</button>
<script>

const cashInput = document.getElementById("cash");
const upiInput = document.getElementById("upi");

function updatePaymentSummary(){

const cash = Number(cashInput.value) || 0;
const upi = Number(upiInput.value) || 0;

const paymentTotal = cash + upi;

document.getElementById("paymentTotal").innerText =
"₹" + paymentTotal;

const sales =
Number(
document.getElementById("totalSales")
.innerText.replace(/[^\d]/g,"")
) || 0;

document.getElementById("difference").innerText =
"₹" + (sales - paymentTotal);

localStorage.setItem("cash",cash);
localStorage.setItem("upi",upi);

}

cashInput.value = localStorage.getItem("cash") || "";
upiInput.value = localStorage.getItem("upi") || "";

cashInput.addEventListener("input",updatePaymentSummary);
upiInput.addEventListener("input",updatePaymentSummary);

updatePaymentSummary();

window.addEventListener("scroll",()=>{

document.getElementById("topBtn").style.display =
window.scrollY>300 ? "block":"none";

});

</script>

<script src="js/app.js"></script>

</body>

</html>
