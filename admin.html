<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="IMAGES/ChatGPT Image Jun 29, 2026, 05_01_39 AM.png">
<title>Admin Panel</title>
<link rel="icon" href="images/thalassery_logo.png">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-[radial-gradient(circle_at_top,#115e59_0%,#064e3b_35%,#022c22_70%,#01110d_100%)] bg-fixed">

<div class="max-w-7xl mx-auto p-6">


    <div class="bg-white/10 backdrop-blur-2xl border border-white/20 text-white rounded-3xl p-6 shadow-2xl">

        <div class="flex justify-between items-center">

            <div>

                <h1 class="text-3xl font-bold">
                     Admin Panel
                </h1>

                <p>Thalassery Hotel POS</p>

            </div>

            <button
                onclick="logout()"
                class="bg-gradient-to-r from-red-500 to-rose-600 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-xl font-bold">

                Logout

            </button>

        </div>

    </div>


    <div class="grid lg:grid-cols-3 gap-6 mt-6">


        <div class="lg:col-span-2">

            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-6 text-white">

                <h2 class="text-xl font-bold mb-5">

                    🍽 Menu Management

                </h2>

                <div id="menuList"></div>

            </div>

        </div>


        <div>


            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-6 mb-6 text-white">

                <h2 class="font-bold text-lg mb-4">

                    ➕ Add Item

                </h2>

                <input
                    id="itemName"
                    class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-3 text-white"
                    placeholder="Item Name">

                <input
                    id="itemPrice"
                    type="number"
                    class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-3 text-white"
                    placeholder="Price">

                <div class="relative w-full mb-3">

   <div class="relative w-full mb-3 z-[999]">

    <button
        id="categoryBtn"
        type="button"
        onclick="toggleCategoryDropdown()"
        class="w-full h-14
        flex items-center justify-between
        px-5
        rounded-2xl
        bg-white/10
        backdrop-blur-xl
        border border-white/20
        text-white
        shadow-[0_8px_30px_rgba(0,0,0,.25)]
        hover:bg-white/15
        transition">

        <span id="selectedCategory">
            Select Category
        </span>

        <svg
            id="categoryArrow"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            class="w-5 h-5 transition-transform duration-300">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 9l6 6 6-6"/>

        </svg>

    </button>

    <div
        id="categoryDropdown"
        class="hidden absolute left-0 top-full mt-2 w-full z-[9999]
        rounded-2xl
        border border-white/20
        bg-[#24584f]/95
        backdrop-blur-3xl
        shadow-[0_20px_50px_rgba(0,0,0,.45)]
        overflow-hidden">

    </div>

</div>
<input type="hidden" id="itemCategory">

                <input
                    id="itemEmoji"
                    class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-3 text-white"
                    placeholder="Emoji (☕ 🍛 🥤)">

                <button
                    onclick="addItem()"
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:scale-105 transition duration-300 text-white rounded-2xl py-3 shadow-xl">

                    Add Item

                </button>

            </div>

            <!-- Hotel Settings -->

            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-6 mt-6 text-white">

    <h2 class="text-xl font-bold mb-5">
        ⚙️ Hotel Settings
    </h2>

    <div class="space-y-4">

        <div>
            <label class="block mb-2 font-semibold">
                🏨 Hotel Name
            </label>

            <input
                id="hotelName"
                type="text"
                class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none"
                placeholder="Hotel Name">
        </div>


        <h3 class="text-lg font-bold">
            🔐 Admin Login
        </h3>

        <div>
            <label class="block mb-2 font-semibold">
                Username
            </label>

            <input
                id="adminUser"
                type="text"
                class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none">
        </div>

        <div>
            <label class="block mb-2 font-semibold">
                Current Password
            </label>

            <input
                id="currentPassword"
                type="password"
                class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none">
        </div>

        <div>
            <label class="block mb-2 font-semibold">
                New Password
            </label>

            <input
                id="newPassword"
                type="password"
                class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none">
        </div>

        <div>
            <label class="block mb-2 font-semibold">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none">
        </div>

      <div class="w-full space-y-4 mt-6">

    <button
        onclick="saveSettings()"
        class="w-full bg-gradient-to-r from-emerald-500 to-cyan-600 hover:scale-105 transition duration-300 text-white py-3 rounded-2xl shadow-xl font-bold">

        💾 Save Settings

    </button>

    <button
        onclick="location.href='reports.html'"
        class="w-full bg-gradient-to-r from-indigo-500 to-cyan-500 hover:scale-105 transition duration-300 text-white py-3 rounded-2xl shadow-xl font-bold">

        📊 View Reports

    </button>

</div>
    </div>

</div>
        </div>

    </div>

</div>
<div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-md hidden items-center justify-center z-50">

    <div class="bg-white/10 backdrop-blur-2xl border border-white/20 rounded-3xl p-6 w-full max-w-md text-white shadow-2xl">

        <h2 class="text-3xl font-bold mb-5">
             Edit Menu Item
        </h2>

        <input
            id="editName"
            class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none"
            placeholder="Item Name">

        <input
            id="editPrice"
            type="number"
            class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-3 text-white placeholder-gray-300 focus:border-emerald-400 outline-none"
            placeholder="Price">

        <div class="relative mb-5 z-50">

    <button
        id="editCategoryBtn"
        type="button"
        onclick="toggleEditDropdown()"
        class="w-full h-14
        flex items-center justify-between
        px-5
        rounded-2xl
        bg-white/10
        backdrop-blur-xl
        border border-white/20
        text-white
        shadow-[0_8px_30px_rgba(0,0,0,.25),inset_0_1px_0_rgba(255,255,255,.12)]
        hover:bg-white/15
        transition">

        <span id="editSelectedCategory">
            Select Category
        </span>

        <svg id="editArrow"
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 transition duration-300"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 9l6 6 6-6"/>

        </svg>

    </button>

    <div
        id="editCategoryDropdown"
    class="hidden absolute left-0 top-full mt-2 w-full
    rounded-2xl
    overflow-hidden
    bg-emerald-950/80
    backdrop-blur-3xl
    border border-emerald-400/20
    shadow-[0_25px_60px_rgba(16,185,129,.25),0_10px_40px_rgba(0,0,0,.5)]
    z-[9999]">
    </div>

</div>

<input
    type="hidden"
    id="editCategory">

        <input
            id="editEmoji"
            class="w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-3 mb-6 text-white placeholder-gray-300 focus:border-emerald-400 outline-none" mb-5"
            placeholder="Emoji">

        <div class="flex gap-3">

            <button
                onclick="updateItem()"
                class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3 rounded-2xl hover:scale-105 transition">

                💾 Save

            </button>

            <button
                onclick="closeModal()"
                class="flex-1 bg-white/20 backdrop-blur-lg border border-white/20 text-white py-3 rounded-2xl hover:bg-white/30 transition">

                Cancel

            </button>

        </div>

    </div>

</div>

<script src="admin.js"></script>
<script src="reports.js"></script>

</body>
</html>
